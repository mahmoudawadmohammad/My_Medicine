name: smart_pillbox
description: تطبيق دوائي - صندوق الدواء الذكي لإدارة الأدوية والأدراج
publish_to: 'none' # منع النشر على pub.dev (تطبيق خاص)
version: 1.0.0+1 # الإصدار الحالي للتطبيق

environment:
  sdk: '>=3.0.0 <4.0.0' # إصدار Dart SDK المطلوب

dependencies:
  flutter:
    sdk: flutter
  workmanager: 0.9.0+2
  sqflite: ^2.3.0
  fl_chart: ^0.69.0
  path: ^1.9.0
  intl: ^0.20.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  get: ^4.6.6
  google_fonts: ^8.2.1
  flutter_native_splash: ^2.3.9
  flutter_animate: ^4.2.0
  shimmer: ^3.0.0
  liquid_swipe: ^3.1.0
  smooth_page_indicator: ^3.0.0
  shared_preferences: ^2.2.2
  flutter_blue_plus: ^2.3.13

  # 🔥 مكتبات الفايربيز (بدون تخزين)
  firebase_core: ^4.15.0
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.0.3
  firebase_messaging: ^16.1.0

  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # قواعد كتابة كود نظيف
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true # استخدام أيقونات Material Design
  assets:
    - assets/icons/
    - assets/fonts/

  # 🔤 الخطوط المخصصة
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# ⚙️ إعدادات شاشة البداية الأصلية
flutter_native_splash:
  color: "#1B7B6E" # لون الخلفية (أخضر داكن)
  android: true # تفعيل على أندرويد
  ios: true # تفعيل على iOS
  web: false # تعطيل على الويب

# 4. إضافة إعدادات أيقونة التطبيق
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#1B7B6E"
  adaptive_icon_foreground: "assets/icons/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21